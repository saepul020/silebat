{% extends 'base.html' %}
{% block title %}Hapus Riwayat Karir{% endblock %}
{% block content %}
<div class="page-header"><h1>Hapus Riwayat Karir</h1><p>Konfirmasi penghapusan pengalaman kerja.</p></div>
<div class="card">
    <p>Hapus riwayat karir {{ obj.jabatan }} di {{ obj.perusahaan }} beserta dokumen pendukungnya?</p>
    <form method="post" class="form-actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Ya, Hapus</button>
        <a href="{% url 'pengguna:karir_daftar' %}" class="btn btn-secondary">Batal</a>
    </form>
</div>
{% endblock %}
