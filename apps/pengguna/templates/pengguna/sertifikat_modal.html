<dialog class="sertifikat-modal" id="sertifikat-modal" aria-labelledby="sertifikat-title">
  <div class="sertifikat-modal__header">
    <h2 id="sertifikat-title">Preview Sertifikat</h2>
    <button type="button" class="btn btn-secondary btn-sm" data-sertifikat-close aria-label="Tutup preview sertifikat"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
  </div>
  <div class="sertifikat-modal__body">
    <img class="sertifikat-modal__image" data-sertifikat-image alt="" hidden>
    <iframe class="sertifikat-modal__frame" data-sertifikat-frame title="Preview sertifikat PDF" hidden></iframe>
  </div>
  <div class="sertifikat-modal__footer">
    <a class="btn btn-secondary" data-sertifikat-link target="_blank" rel="noopener noreferrer">Buka File Sertifikat</a>
  </div>
</dialog>
